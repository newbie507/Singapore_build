apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller-cninode-access
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: singapore-argocd  # ArgoCD가 설치된 네임스페이스
roleRef:
  kind: ClusterRole
  name: cluster-admin  # cluster-admin 권한을 부여
  apiGroup: rbac.authorization.k8s.io

